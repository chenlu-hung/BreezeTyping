name: BreezeTyping
options:
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  bundleIdPrefix: com.breezetyping

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "0.9.0"
  sherpa-onnx:
    url: https://github.com/k2-fsa/sherpa-onnx.git
    minorVersion: "1.13.7"

targets:
  BreezeTyping:
    type: application
    platform: macOS
    sources:
      - path: BreezeTyping
        excludes:
          - "Resources/Info.plist"
    info:
      path: BreezeTyping/Resources/Info.plist
      properties:
        NSPrincipalClass: $(PRODUCT_MODULE_NAME).NSManualApplication
        InputMethodConnectionName: $(PRODUCT_BUNDLE_IDENTIFIER)_Connection
        InputMethodServerControllerClass: $(PRODUCT_MODULE_NAME).BreezeTypingInputController
        LSBackgroundOnly: true
        tsInputMethodCharacterRepertoireKey:
          - Hant
          - Hans
          - Latn
        tsInputMethodIconFileKey: main.tiff
        NSMicrophoneUsageDescription: "BreezeTyping 需要麥克風權限來進行語音輸入。"
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.breezetyping.inputmethod.BreezeTyping
        PRODUCT_NAME: BreezeTyping
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: BreezeTyping/Resources/BreezeTyping.entitlements
        INFOPLIST_FILE: BreezeTyping/Resources/Info.plist
    dependencies:
      - package: WhisperKit
      - package: sherpa-onnx
        product: sherpa-onnx
    entitlements:
      path: BreezeTyping/Resources/BreezeTyping.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
